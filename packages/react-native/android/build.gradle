def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def resolveReactNativeDirectory() {
  File standard = file("$rootDir/../node_modules/react-native/")
  if (standard.exists()) {
    return standard
  }
  File legacy = file("$projectDir/../node_modules/react-native/")
  if (legacy.exists()) {
    return legacy
  }
  String path = providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim()
  return file(path).parentFile
}

def reactNativeRootDir = resolveReactNativeDirectory()

def isNewArchitectureEnabled() {
  return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

group = "com.callstackincubator.cordierite"
version = "0.4.0-rc.1" // keep in sync with package.json

android {
  namespace "com.callstackincubator.cordierite"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
    versionCode 1
    versionName "0.4.0-rc.1" // keep in sync with package.json
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    // Ships a keep rule for CordieriteNativeMarker (see consumer-rules.pro) to every consuming app's
    // R8/ProGuard pass, so `cordierite doctor` (docs/tasks/10-android-detection-keep-rule.md) has a
    // detection anchor that survives minification even with no config plugin and no app-authored
    // keep rules for this package.
    consumerProguardFiles "consumer-rules.pro"
  }

  buildFeatures {
    buildConfig true
  }

  lintOptions {
    abortOnError false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  maven {
    url "${reactNativeRootDir}/android"
  }
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"

  // Pure-logic JVM tests (SPKI pin parity, metadata parsing, protocol-v2 frame shape); no
  // Robolectric/emulator dependency needed. Run with `./gradlew :cordierite_react-native:testDebugUnitTest`
  // from playground/android (the autolinked consumer app), or any consumer app that includes this module.
  testImplementation "junit:junit:4.13.2"
  // Real org.json implementation: the stub in android.jar throws "not mocked" for every method at
  // unit-test runtime (same reason expo-modules-core's own tests depend on this).
  testImplementation "org.json:json:20180813"
}

tasks.register("assertNewArchitectureEnabled") {
  onlyIf { !isNewArchitectureEnabled() }
  doFirst {
    throw new GradleException(
      "@cordierite/react-native requires New Architecture. Set newArchEnabled=true in gradle.properties.",
    )
  }
}

preBuild.dependsOn(assertNewArchitectureEnabled)
