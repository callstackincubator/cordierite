name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  test:
    uses: ./.github/workflows/test.yaml

  package:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm via corepack
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack" pnpm
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
          corepack prepare --activate
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No cache: pnpm here, deliberately. This job builds and publishes release tarballs, so
          # restoring a pnpm store from a prior run's cache would let a poisoned cache entry slip
          # dependencies into a published package. Every run resolves and installs cleanly.
      - name: Validate production release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -e '
            const packages = ["shared", "cordierite", "react-native"].map(
              (name) => require(`./packages/${name}/package.json`).version,
            );
            if (new Set(packages).size !== 1) throw new Error(`Package versions differ: ${packages.join(", ")}`);
            if (packages[0].includes("-")) throw new Error(`Prerelease versions are not publishable: ${packages[0]}`);
            process.stdout.write(packages[0]);
          ')
          test "$RELEASE_TAG" = "v$version"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build
      - name: Pack release tarballs
        run: |
          mkdir release
          pnpm --filter @cordierite/shared pack --pack-destination release
          pnpm --filter cordierite pack --pack-destination release
          pnpm --filter @cordierite/react-native pack --pack-destination release
      - name: Upload release tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: release/*.tgz
          retention-days: 1
          compression-level: 0

  publish-shared:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify npm version
        run: >-
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);'
          "$(npm --version)"
      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: release
      - name: Publish shared package
        run: npm publish ./release/cordierite-shared-*.tgz --access public --provenance --tag latest

  publish-cli:
    needs: publish-shared
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify npm version
        run: >-
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);'
          "$(npm --version)"
      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: release
      - name: Publish CLI package
        run: npm publish ./release/cordierite-[0-9]*.tgz --access public --provenance --tag latest

  publish-react-native:
    needs: publish-shared
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify npm version
        run: >-
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);'
          "$(npm --version)"
      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: release
      - name: Publish React Native package
        run: npm publish ./release/cordierite-react-native-*.tgz --access public --provenance --tag latest
