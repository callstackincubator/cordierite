name: CodeQL debug

# Temporary: runs CodeQL on this branch and prints the findings, so the alert
# behind the "CodeQL" check on PR #37 can be read without the security tab.
on:
  push:
    branches: [claude/cordierite-pr-merge-r31r38]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: sarif-results
      - name: Print findings
        if: always()
        run: |
          for f in sarif-results/*.sarif; do
            echo "=== $f"
            jq -r '.runs[].results[] | "RULE \(.ruleId) | \(.message.text) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' "$f"
          done
