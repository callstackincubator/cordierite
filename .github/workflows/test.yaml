name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.5.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build
      - name: Run JavaScript tests
        run: pnpm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.5.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build
      - name: Prebuild Android
        working-directory: playground
        env:
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Test and assemble Android
        working-directory: playground/android
        run: >-
          ./gradlew :cordierite_react-native:testDebugUnitTest assembleDebug
          --no-daemon --no-build-cache --no-configuration-cache
      - name: Assemble Android release (Cordierite included, the default)
        working-directory: playground/android
        run: >-
          ./gradlew assembleRelease
          --no-daemon --no-build-cache --no-configuration-cache
      - name: cordierite doctor — assert present (default autolinking config)
        run: >-
          node packages/cordierite/bin.js doctor
          playground/android/app/build/outputs/apk/release/app-release.apk
          --assert-present
      - name: Apply the package.json autolinking-exclude recipe
        # Mutates the playground's checked-out config for this job only (never committed): adds
        # the documented `expo.autolinking.android.exclude` entry to package.json, and drops the
        # `@cordierite/react-native` config plugin entry from app.json entirely (the README's own
        # "skip this whole plugin entry" guidance for a build that doesn't carry Cordierite at
        # all) so the plugin's own include/autolinking consistency assertion
        # (docs/tasks/06-config-plugin-rewrite.md) never runs, and so it doesn't write
        # CLI_PINS/TRUST/ALLOW_PRIVATE_LAN_ONLY manifest meta-data into a build that's supposed
        # to carry no Cordierite footprint at all — `artifact-inspect.ts` treats those keys as an
        # inclusion signal, so leaving them in would make `--assert-absent` fail even with the
        # native module correctly excluded. This is the regression test for
        # docs/tasks/02-fix-autolinking-exclusion.md — the exact recipe documented in the
        # README/SECURITY.md, verified against a real build instead of by inspection.
        working-directory: playground
        run: |
          node -e '
            const fs = require("fs");

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.expo = pkg.expo || {};
            pkg.expo.autolinking = pkg.expo.autolinking || {};
            pkg.expo.autolinking.android = { exclude: ["@cordierite/react-native"] };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.plugins = app.expo.plugins.filter(
              (entry) => !(Array.isArray(entry) && entry[0] === "@cordierite/react-native")
            );
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          '
      - name: Re-prebuild Android with Cordierite excluded
        working-directory: playground
        env:
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Assemble Android release (Cordierite excluded)
        working-directory: playground/android
        run: >-
          ./gradlew assembleRelease
          --no-daemon --no-build-cache --no-configuration-cache
      - name: cordierite doctor — assert absent (excluded via package.json)
        run: >-
          node packages/cordierite/bin.js doctor
          playground/android/app/build/outputs/apk/release/app-release.apk
          --assert-absent

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.5.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build
      - name: Prebuild iOS
        working-directory: playground
        env:
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
          LANG: en_US.UTF-8
        run: pnpm exec expo prebuild --platform ios
      - name: Test Cordierite native library
        run: |
          ruby playground/scripts/create-cordierite-test-scheme.rb playground/ios/Pods/Pods.xcodeproj
          cd playground/ios
          xcodebuild test -workspace playground.xcworkspace -scheme Cordierite-Native-Tests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
      - name: Build playground for iOS Simulator
        working-directory: playground/ios
        run: >-
          xcodebuild build -workspace playground.xcworkspace -scheme playground -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
