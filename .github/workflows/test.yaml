name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm via corepack
        # Ahead of setup-node on purpose: `cache: pnpm` below resolves the store by running
        # `pnpm store path --silent` inside setup-node's own step, so pnpm has to be on PATH by
        # then. The shims land in their own directory rather than beside the runner's preinstalled
        # node, so this cannot clobber the image's yarn; they are symlinks into that node's corepack
        # behind a `#!/usr/bin/env node` shebang, so they keep working once setup-node puts its own
        # Node 24 at the front of PATH.
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack" pnpm
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
          corepack prepare --activate
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Caches the pnpm store, keyed on pnpm-lock.yaml. Supersedes package-manager-cache: false,
          # which was a no-op here: that input only gates auto-detection, and auto-detection only
          # fires when package.json's packageManager field names npm — this repo's names pnpm.
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build
      - name: Run JavaScript tests
        run: pnpm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm via corepack
        # Ahead of setup-node on purpose: `cache: pnpm` below resolves the store by running
        # `pnpm store path --silent` inside setup-node's own step, so pnpm has to be on PATH by
        # then. The shims land in their own directory rather than beside the runner's preinstalled
        # node, so this cannot clobber the image's yarn; they are symlinks into that node's corepack
        # behind a `#!/usr/bin/env node` shebang, so they keep working once setup-node puts its own
        # Node 24 at the front of PATH.
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack" pnpm
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
          corepack prepare --activate
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Caches the pnpm store, keyed on pnpm-lock.yaml. Supersedes package-manager-cache: false,
          # which was a no-op here: that input only gates auto-detection, and auto-detection only
          # fires when package.json's packageManager field names npm — this repo's names pnpm.
          cache: pnpm
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Set up Gradle
        # Caches the Gradle user home across runs: downloaded dependencies (including React
        # Native's prebuilt .so artifacts) and the local build cache under
        # ~/.gradle/caches/build-cache-1. The build cache has to live there rather than in the
        # project, because `expo prebuild --clean` below deletes playground/android outright.
        # Writes the cache only from the default branch (the action's default), so a PR can never
        # poison what main restores.
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build
      - name: Prebuild Android
        working-directory: playground
        env:
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Test and assemble Android
        working-directory: playground/android
        # `-PreactNativeArchitectures=arm64-v8a` builds one ABI instead of the four in
        # gradle.properties. Nothing downstream reads native code: `cordierite doctor`'s Android
        # signals are all dex entries and AndroidManifest strings (see
        # packages/cordierite/src/artifact-inspect.ts), so a single-ABI APK proves exactly as much
        # about inclusion as a four-ABI one. The configuration cache stays off deliberately —
        # inclusion is driven by CORDIERITE_ENABLED at prebuild time, and this job is the thing
        # that proves that gate works, so it does not get to trust a cached configuration phase.
        run: >-
          ./gradlew :cordierite_react-native:testDebugUnitTest assembleDebug
          --build-cache --no-configuration-cache -PreactNativeArchitectures=arm64-v8a
      - name: cordierite doctor — assert present (debug, the default)
        run: >-
          node packages/cordierite/bin.js doctor
          playground/android/app/build/outputs/apk/debug/app-debug.apk
          --assert-present
      - name: Assemble Android release (default autolinking config)
        working-directory: playground/android
        # Same android/ directory as the debug build above, still generated from the unset
        # CORDIERITE_ENABLED prebuild — android/build.gradle's release source-set swap compiles
        # the no-op CordieritePackage stub for this variant by default.
        run: >-
          ./gradlew assembleRelease
          --build-cache --no-configuration-cache -PreactNativeArchitectures=arm64-v8a
      - name: cordierite doctor — assert absent (release, the default)
        run: >-
          node packages/cordierite/bin.js doctor
          playground/android/app/build/outputs/apk/release/app-release.apk
          --assert-absent
      - name: Re-prebuild Android with Cordierite enabled for release
        working-directory: playground
        env:
          CORDIERITE_ENABLED: "1"
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Assemble Android release (Cordierite explicitly enabled)
        env:
          CORDIERITE_ENABLED: "1"
        working-directory: playground/android
        run: >-
          ./gradlew assembleRelease
          --build-cache --no-configuration-cache -PreactNativeArchitectures=arm64-v8a
      - name: cordierite doctor — assert present (release, CORDIERITE_ENABLED=1)
        run: >-
          node packages/cordierite/bin.js doctor
          playground/android/app/build/outputs/apk/release/app-release.apk
          --assert-present
      - name: Re-prebuild Android with Cordierite excluded
        working-directory: playground
        env:
          CORDIERITE_ENABLED: "0"
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Assemble Android release (Cordierite excluded)
        env:
          CORDIERITE_ENABLED: "0"
        working-directory: playground/android
        run: >-
          ./gradlew assembleRelease
          --build-cache --no-configuration-cache -PreactNativeArchitectures=arm64-v8a
      - name: cordierite doctor — assert absent (excluded via CORDIERITE_ENABLED)
        run: >-
          node packages/cordierite/bin.js doctor
          playground/android/app/build/outputs/apk/release/app-release.apk
          --assert-absent

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Deliberately NOT USE_CCACHE=1. That makes react_native_post_install override CC/CXX/LD with
      # $(REACT_NATIVE_PATH)/scripts/xcode/ccache-clang.sh, and REACT_NATIVE_PATH does not resolve
      # for the CocoaPods-generated test app host in this pnpm workspace — react-native is hoisted
      # to the monorepo root, above playground/, so the setting expands to a path missing its
      # prefix and clang fails with "unable to spawn process". Xcode's own build-setting spec also
      # says not to do it: "Don't use the CC, CPLUSPLUS, OBJCC, or OBJCPLUSPLUS build settings to
      # specify a compiler launcher." The supported mechanism is C_COMPILER_LAUNCHER, passed to
      # each xcodebuild invocation below.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Content hashing rather than the default timestamp check: a CI checkout re-creates every
      # source file, so mtimes are always new and a timestamp-keyed cache would never hit.
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
      # Required, together with the `modules` sloppiness above, for ccache to cache anything at all
      # here: these pods compile with -fmodules, and ccache's limited Clang-modules support needs
      # both direct mode and depend mode. Without it ccache reports 98.9% of calls as uncacheable
      # ("Could not use modules"). Depend mode needs the compiler to emit -MD/-MMD, which Xcode
      # already does. It hashes the dependency file instead of preprocessing, so misses are cheaper
      # too; the cost is a lower hit rate, since any compiler-option change now changes the hash.
      #
      # Measured on this job: warm, 579 cacheable calls and 579 hits, and the job runs in ~7m
      # against ~34m before any of this. Cold, the bookkeeping is a net loss — the first run after
      # an eviction came in around 20m, worse than the ~14m this job takes with ccache removed
      # entirely. So a slow iOS run here usually means the cache was evicted, not that something
      # regressed. Note ~63% of intercepted calls are link steps ccache can do nothing with, and
      # -fmodules compiles it still refuses outright; the hits come from the rest.
      CCACHE_DEPEND: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm via corepack
        # Ahead of setup-node on purpose: `cache: pnpm` below resolves the store by running
        # `pnpm store path --silent` inside setup-node's own step, so pnpm has to be on PATH by
        # then. The shims land in their own directory rather than beside the runner's preinstalled
        # node, so this cannot clobber the image's yarn; they are symlinks into that node's corepack
        # behind a `#!/usr/bin/env node` shebang, so they keep working once setup-node puts its own
        # Node 24 at the front of PATH.
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack" pnpm
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
          corepack prepare --activate
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Caches the pnpm store, keyed on pnpm-lock.yaml. Supersedes package-manager-cache: false,
          # which was a no-op here: that input only gates auto-detection, and auto-detection only
          # fires when package.json's packageManager field names npm — this repo's names pnpm.
          cache: pnpm
      - name: Install ccache
        # C_COMPILER_LAUNCHER wants a path, so resolve it once here rather than relying on the
        # build system inheriting a PATH that can find it.
        run: |
          brew list ccache > /dev/null 2>&1 || brew install ccache
          echo "CCACHE_BIN=$(command -v ccache)" >> "$GITHUB_ENV"
      - name: Cache ccache
        # Keyed on the run id so every run writes a fresh entry (cache entries are immutable) and
        # restore-keys falls back to the most recent previous one.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ios-${{ github.run_id }}
          restore-keys: ccache-ios-
      - name: Cache CocoaPods downloads
        # Holds the prebuilt React Native core and ReactNativeDependencies xcframework tarballs the
        # Podfile opts into via RCT_USE_PREBUILT_RNCORE — pure downloads, re-fetched twice per run
        # otherwise because `expo prebuild --clean` wipes playground/ios.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: cocoapods-${{ hashFiles('pnpm-lock.yaml', 'playground/package.json') }}
          restore-keys: cocoapods-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build
      - name: Prebuild iOS
        working-directory: playground
        env:
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
          LANG: en_US.UTF-8
        run: pnpm exec expo prebuild --platform ios
      - name: Test Cordierite native library
        # Shares -derivedDataPath with the playground build below. Both are the same pods at the
        # same commit in the same configuration, so the app build reuses everything the test build
        # already compiled instead of compiling the pod graph a second time. The excluded build
        # further down deliberately keeps its own derived data: it is the artifact the doctor
        # --assert-absent gate inspects, and it gets a clean one.
        run: |
          ruby playground/scripts/create-cordierite-test-scheme.rb playground/ios/Pods/Pods.xcodeproj
          cd playground/ios
          xcodebuild test -workspace playground.xcworkspace -scheme Cordierite-Native-Tests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build-included \
            C_COMPILER_LAUNCHER="$CCACHE_BIN" \
            CLANG_ENABLE_EXPLICIT_MODULES_WITH_COMPILER_LAUNCHER=YES \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
      - name: Build playground for iOS Simulator
        working-directory: playground/ios
        # ARCHS=arm64 only: the generic simulator destination otherwise builds arm64 and x86_64,
        # and nothing here runs on an Intel simulator. The doctor gate reads the Objective-C class
        # name and Info.plist keys, neither of which is per-slice.
        run: >-
          xcodebuild build -workspace playground.xcworkspace -scheme playground -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build-included ARCHS=arm64 ONLY_ACTIVE_ARCH=NO
          C_COMPILER_LAUNCHER="$CCACHE_BIN" CLANG_ENABLE_EXPLICIT_MODULES_WITH_COMPILER_LAUNCHER=YES
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
      - name: cordierite doctor — assert present (debug, the default)
        # Debug only -- iOS Release-configuration coverage for the new dev-only default is not
        # wired here yet (matching Debug is `Debug`; Release links only when CORDIERITE_ENABLED=1).
        run: >-
          node packages/cordierite/bin.js doctor
          playground/ios/build-included/Build/Products/Debug-iphonesimulator/playground.app
          --assert-present
      - name: Re-prebuild iOS with Cordierite excluded
        working-directory: playground
        env:
          CORDIERITE_ENABLED: "0"
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
          LANG: en_US.UTF-8
        run: pnpm exec expo prebuild --platform ios --clean
      - name: Build playground for iOS Simulator (Cordierite excluded)
        env:
          CORDIERITE_ENABLED: "0"
        working-directory: playground/ios
        run: >-
          xcodebuild build -workspace playground.xcworkspace -scheme playground -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build-excluded ARCHS=arm64 ONLY_ACTIVE_ARCH=NO
          C_COMPILER_LAUNCHER="$CCACHE_BIN" CLANG_ENABLE_EXPLICIT_MODULES_WITH_COMPILER_LAUNCHER=YES
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
      - name: cordierite doctor — assert absent (excluded via CORDIERITE_ENABLED)
        run: >-
          node packages/cordierite/bin.js doctor
          playground/ios/build-excluded/Build/Products/Debug-iphonesimulator/playground.app
          --assert-absent
      - name: Report ccache statistics
        if: always()
        run: ccache --show-stats --verbose
