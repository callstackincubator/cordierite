name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build
      - name: Run JavaScript tests
        run: pnpm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build
      - name: Prebuild Android
        working-directory: playground
        env:
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Test and assemble Android
        working-directory: playground/android
        run: >-
          ./gradlew :cordierite_react-native:testDebugUnitTest assembleDebug
          --no-daemon --no-build-cache --no-configuration-cache

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build
      - name: Prebuild iOS
        working-directory: playground
        env:
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
          LANG: en_US.UTF-8
        run: pnpm exec expo prebuild --platform ios
      - name: Test Cordierite native library
        run: |
          ruby playground/scripts/create-cordierite-test-scheme.rb playground/ios/Pods/Pods.xcodeproj
          cd playground/ios
          xcodebuild test -workspace playground.xcworkspace -scheme Cordierite-Native-Tests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
      - name: Build playground for iOS Simulator
        working-directory: playground/ios
        run: >-
          xcodebuild build -workspace playground.xcworkspace -scheme playground -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
